<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <style>
    .box{fill:#172033;stroke:#6ea8fe;stroke-width:2;rx:14}
    .small{fill:#172033;stroke:#71d7b0;stroke-width:2;rx:14}
    .title{fill:#ffffff;font:700 22px Arial,"Microsoft YaHei",sans-serif}
    .text{fill:#dbe7ff;font:16px Arial,"Microsoft YaHei",sans-serif}
    .arrow{stroke:#91a7c9;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#91a7c9"/></marker></defs>
  <rect width="1100" height="420" fill="#0d1117"/>
  <text x="550" y="38" text-anchor="middle" class="title">SupportFlow 系统架构</text>
  <rect x="40" y="130" width="210" height="120" class="box"/>
  <text x="145" y="166" text-anchor="middle" class="title">员工 / 管理员</text>
  <text x="145" y="198" text-anchor="middle" class="text">浏览器工作台</text>
  <text x="145" y="224" text-anchor="middle" class="text">查询与提交申请</text>
  <rect x="315" y="100" width="250" height="180" class="box"/>
  <text x="440" y="138" text-anchor="middle" class="title">FastAPI 后端</text>
  <text x="440" y="174" text-anchor="middle" class="text">登录 / 权限 / 审批</text>
  <text x="440" y="202" text-anchor="middle" class="text">数量 / 库存 / 幂等校验</text>
  <text x="440" y="230" text-anchor="middle" class="text">LangGraph + SSE</text>
  <rect x="630" y="100" width="210" height="180" class="small"/>
  <text x="735" y="138" text-anchor="middle" class="title">业务数据</text>
  <text x="735" y="174" text-anchor="middle" class="text">订单 / 生产 / 质检</text>
  <text x="735" y="202" text-anchor="middle" class="text">库存 / 出库 / 审计</text>
  <text x="735" y="230" text-anchor="middle" class="text">SQLite 演示数据库</text>
  <rect x="905" y="100" width="155" height="180" class="small"/>
  <text x="982" y="138" text-anchor="middle" class="title">智能能力</text>
  <text x="982" y="174" text-anchor="middle" class="text">LLM 理解</text>
  <text x="982" y="202" text-anchor="middle" class="text">RAG 检索</text>
  <text x="982" y="230" text-anchor="middle" class="text">本地模型</text>
  <path d="M250 190 H315" class="arrow"/><path d="M565 190 H630" class="arrow"/><path d="M840 190 H905" class="arrow"/>
  <text x="550" y="350" text-anchor="middle" class="text">LLM 负责理解表达；后端负责事实、权限、审批和数据修改</text>
</svg>
